/* =========================================================
   ANIMERT SNØ
========================================================= */

.snow{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:100;
  opacity:.65;

  background-image:
    radial-gradient(#fff 1px,transparent 1.5px),
    radial-gradient(#fff 2px,transparent 2.5px),
    radial-gradient(#fff 1.3px,transparent 1.8px);

  background-size:
    42px 42px,
    95px 95px,
    68px 68px;

  animation:snowfall 17s linear infinite;
}

@keyframes snowfall{
  to{
    background-position:
      30px 850px,
      -40px 1100px,
      70px 760px;
  }
}
